<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Jug Studios – Discord</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #eee;

        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;

        overflow: hidden;
    }

    /* Animated gradient background */
    body::before {
        content: "";
        position: fixed;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, #000814, #001d3d, #000000);
        background-size: 400% 400%;
        animation: gradientMove 15s ease infinite;
        z-index: -2;
    }

    @keyframes gradientMove {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-25%, -25%); }
        100% { transform: translate(0, 0); }
    }

    /* Floating circles container */
    .circles {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
    }

    .circle {
        position: absolute;
        bottom: -60px;
        background: rgba(255, 215, 0, 0.8);
        border-radius: 50%;
        animation: floatUp linear forwards;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-110vh) scale(0.3);
            opacity: 0;
        }
    }

    /* Discord widget container */
    .widget-container {
        position: relative;
        z-index: 1;

        background: rgba(20, 20, 20, 0.85);
        padding: 20px;
        border-radius: 16px;

        box-shadow: 0 0 25px rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);

        text-align: center;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #fff;
    }

    iframe {
        border: none;
        border-radius: 12px;
        overflow: hidden;
    }
</style>
</head>

<body>

<div class="circles"></div>

<div class="widget-container">
    <h1>Our Discord server</h1>

    <iframe
        src="https://discord.com/widget?id=1401944577853886557&theme=dark"
        width="350"
        height="500"
        allowtransparency="true"
        frameborder="0"
        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>
</div>

<script>
    const container = document.querySelector('.circles');

    function createCircle() {
        const circle = document.createElement('div');
        circle.classList.add('circle');

        const size = Math.random() * 40 + 10;
        circle.style.width = size + 'px';
        circle.style.height = size + 'px';
        circle.style.left = Math.random() * 100 + 'vw';

        const duration = Math.random() * 10 + 10;
        circle.style.animationDuration = duration + 's';

        container.appendChild(circle);

        setTimeout(() => {
            circle.remove();
        }, duration * 1000);
    }

    setInterval(createCircle, 500);
</script>

</body>
</html>
